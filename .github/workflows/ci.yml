name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    name: Build, audit, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean library (with Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          lint: false
          test: false
      - name: Build complete experimental development
        run: lake build NLAlib.Experimental
      - name: Default import surface is current
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/import_surface.py --check
      - name: Default library axiom audit (no sorry)
        run: lake env lean scripts/AuditTrusted.lean
      - name: Standard declaration and instance linters
        run: lake env lean scripts/Lint.lean
      - name: Downstream API examples
        run: |
          lake env lean Examples/Downstream.lean
          lake env lean Examples/Probability.lean
          lake env lean Examples/PolynomialApproximation.lean
          lake env lean scripts/AuditRitz.lean
          lake env lean scripts/AuditSubspaces.lean
      - name: Experimental development axiom inventory
        run: lake env lean scripts/Audit.lean
      - name: Completed Gaussian statements and new proof helpers
        run: |
          lake env lean -DautoImplicit=false scripts/AuditGaussianInverse.lean
          lake env lean -DautoImplicit=false scripts/AuditNewProofs.lean
      - name: Declaration index is current
        run: |
          lake env lean scripts/ExtractDecls.lean
          git diff --exit-code -- atlas/declarations.json || (echo 'atlas/declarations.json is stale: run lake env lean scripts/ExtractDecls.lean and commit' && exit 1)
      - name: Import-layer lint
        run: python3 scripts/check_layers.py
      - name: Naming and file rules
        run: python3 scripts/check_names.py
      - name: Atlas consistency
        run: |
          pip install --quiet jsonschema
          python3 scripts/check_atlas.py
          python3 scripts/check_polynomial_matrix_scope.py
      - name: Book coverage references and proof status
        run: python3 scripts/coverage.py
      - name: Site builds
        run: python3 scripts/build_site.py
