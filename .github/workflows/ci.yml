name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    name: Build, audit, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean library (with Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          lint: false
          test: false
      - name: Axiom audit (no sorry, only the three standard axioms)
        run: lake env lean scripts/Audit.lean
      - name: Completed Gaussian statements and new proof helpers
        run: |
          lake env lean -DautoImplicit=false scripts/AuditGaussianInverse.lean
          lake env lean -DautoImplicit=false scripts/AuditNewProofs.lean
      - name: Declaration index is current
        run: |
          lake env lean scripts/ExtractDecls.lean
          git diff --exit-code -- atlas/declarations.json || (echo 'atlas/declarations.json is stale: run lake env lean scripts/ExtractDecls.lean and commit' && exit 1)
      - name: Import-layer lint
        run: python3 scripts/check_layers.py
      - name: Naming and file rules
        run: python3 scripts/check_names.py
      - name: Atlas consistency
        run: |
          pip install --quiet jsonschema
          python3 scripts/check_atlas.py
      - name: Site builds
        run: python3 scripts/build_site.py
